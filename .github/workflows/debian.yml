name: Debian Package

on:
  push:
    branches: [ main ]
    tags: [ '*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        dist: [ trixie, forky ]
    uses: ./.github/workflows/debian-build.yml
    with:
      dist: ${{ matrix.dist }}

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: debian-*-packages
          path: dist
          merge-multiple: true

      - name: Publish Debian packages to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "${{ github.ref_name }}" dist/* --clobber || \
          gh release create "${{ github.ref_name }}" dist/* --generate-notes
